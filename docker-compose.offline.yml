# ═══════════════════════════════════════════════════════════════
#  Aurora — offline overlay. Proves the stack works on a server with no route to the
#  internet: Open-Meteo, the NCPOR page, Groq and HuggingFace are all optional and must
#  degrade honestly (CLAUDE.md: never present fabricated data as real).
#
#      docker compose -f docker-compose.yml -f docker-compose.offline.yml up -d
#
#  The Python services join only `aurora-internal`, a network Docker gives no external
#  route. nginx stays on both, so the UI is still published on HTTP_PORT while it reaches
#  the backend over the internal network.
# ═══════════════════════════════════════════════════════════════

services:
  frontend:
    networks: [aurora, aurora-internal]

  # `!override` replaces the base file's network list instead of merging with it.
  # (`!reset` would discard the value given here and leave them with no network at all.)
  backend:
    networks: !override
      - aurora-internal

  simulator:
    networks: !override
      - aurora-internal

networks:
  aurora-internal:
    driver: bridge
    internal: true
