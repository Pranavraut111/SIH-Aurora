# ═══════════════════════════════════════════════════════════════
# Aurora Backend — Application Configuration
# Uses H2 by default for zero-config dev, PostgreSQL for production
# ═══════════════════════════════════════════════════════════════

spring.application.name=aurora-backend
server.port=8080
server.address=${HOST:127.0.0.1}

# ── CORS / WebSocket origins ──────────────────────────────────
# Comma-separated; overridable with the ALLOWED_ORIGINS env var. Never use "*".
aurora.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}

# ── H2 (default dev profile) ─────────────────────────────────
spring.datasource.url=jdbc:h2:mem:aurora;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# H2 web console disabled (security: PROJECT_CONTEXT.md §15 / P0-6)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ── JPA ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── WebSocket ─────────────────────────────────────────────────
aurora.websocket.endpoint=/ws/station
aurora.websocket.push-interval-ms=2000

# ── Simulator ─────────────────────────────────────────────────
aurora.simulator.tick-interval-ms=2000
aurora.ai-service.url=http://localhost:8000

# ── Logging ───────────────────────────────────────────────────
logging.level.com.aurora=INFO
logging.level.org.springframework.web.socket=INFO
