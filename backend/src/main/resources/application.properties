# ═══════════════════════════════════════════════════════════════
# Aurora Backend — Application Configuration
# Uses H2 by default for zero-config dev, PostgreSQL for production
# ═══════════════════════════════════════════════════════════════

spring.application.name=aurora-backend
server.port=8080

# ── CORS ──────────────────────────────────────────────────────
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ── H2 (default dev profile) ─────────────────────────────────
spring.datasource.url=jdbc:h2:mem:aurora;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── WebSocket ─────────────────────────────────────────────────
aurora.websocket.endpoint=/ws/station
aurora.websocket.push-interval-ms=2000

# ── Simulator ─────────────────────────────────────────────────
aurora.simulator.tick-interval-ms=2000
aurora.ai-service.url=http://localhost:8000

# ── Logging ───────────────────────────────────────────────────
logging.level.com.aurora=INFO
logging.level.org.springframework.web.socket=INFO
