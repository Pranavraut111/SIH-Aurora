# ═══════════════════════════════════════════════════════════════
#  Aurora — security headers, included by every location in nginx.conf.
#
#  nginx's add_header is NOT additive across levels: "These directives are inherited
#  from the previous configuration level if and only if there are no add_header
#  directives defined on the current level." Any location that sets its own header
#  therefore drops every header from the server block — so this snippet has to be
#  included in each one rather than written once in `server`.
# ═══════════════════════════════════════════════════════════════

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

# CSP covering exactly what Aurora uses, and nothing more:
#   script-src 'self'          — the Vite build emits no inline script at all.
#   style-src  'unsafe-inline' — React/framer-motion/recharts set style attributes.
#   img-src    data:/blob:     — three.js canvas textures and generated sprites.
#   connect-src 'self'         — REST and the same-origin WebSocket (/ws/station);
#                                this is what blocks a cross-origin backend, so the
#                                image must be built with VITE_API_URL=/api.
#   font-src   'self' data:    — the three families are self-hosted (@fontsource),
#                                and Vite inlines the subsets under 4 kB as data: URIs.
# No third-party origin appears anywhere, which is what lets the stack run offline.
# Verified in a real browser against the built bundle, and again in CI through nginx.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
