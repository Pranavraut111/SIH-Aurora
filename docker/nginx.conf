# ═══════════════════════════════════════════════════════════════
#  Aurora — nginx: serves the Vite bundle and reverse-proxies the backend so the
#  browser only ever talks to one origin (no CORS, no backend address in the JS).
#
#  Installed as /etc/nginx/templates/default.conf.template, so the nginx entrypoint
#  substitutes ${BACKEND_HOST} and ${BACKEND_PORT} at container start.
# ═══════════════════════════════════════════════════════════════

upstream aurora_backend {
    server ${BACKEND_HOST}:${BACKEND_PORT};
    keepalive 16;
}

# Map the client's Upgrade header through to the backend. Without this a plain
# `proxy_set_header Connection upgrade` would break ordinary keep-alive requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The browser sees the station config, telemetry snapshots and reports; none of it
    # is large, but gzip still saves a lot on the JSON and the bundle.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Fonts and images are already compressed; re-compressing them wastes CPU.
    client_max_body_size 2m;
    server_tokens off;

    # ── Security headers ──────────────────────────────────────
    # Applied to every response, including the proxied API.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP covering exactly what Aurora uses, and nothing more:
    #   script-src 'self'          — the Vite build emits no inline script at all.
    #   style-src  'unsafe-inline' — React/framer-motion/recharts set style attributes.
    #   img-src    data:/blob:     — three.js canvas textures and generated sprites.
    #   connect-src 'self'         — REST and the same-origin WebSocket (/ws/station);
    #                                this is what blocks a cross-origin backend, so the
    #                                image must be built with VITE_API_URL=/api.
    #   font-src   'self' data:    — the three families are self-hosted (@fontsource),
    #                                and Vite inlines the subsets under 4 kB as data: URIs.
    # No third-party origin appears anywhere, which is what lets the stack run offline.
    # Verified in a real browser against the built bundle (see docs/DEPLOYMENT.md).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # ── Container healthcheck ─────────────────────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── WebSocket: /ws/station -> backend ─────────────────────
    # Must come before the SPA fallback. The telemetry stream is long-lived and the
    # backend only pushes on each tick, so the read timeout has to be generous.
    location /ws {
        proxy_pass http://aurora_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── REST: /api/* -> backend ───────────────────────────────
    location /api/ {
        proxy_pass http://aurora_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The AI/explain routes are proxied on to the simulator, and a Chronos
        # forecast can take a few seconds on a small VM.
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        # API responses are per-request state; never let a proxy or browser keep them.
        add_header Cache-Control "no-store" always;
    }

    # ── Static assets ─────────────────────────────────────────
    # Vite fingerprints every file under /assets/, so these can be cached forever.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unhashed files in public/ (the favicon, logos): a day is a safe middle ground.
    location ~* \.(?:ico|png|jpe?g|gif|svg|webp|woff2?)$ {
        access_log off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # ── SPA fallback ──────────────────────────────────────────
    # index.html must never be cached, or a browser keeps loading asset hashes that
    # no longer exist after an update.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate" always;
    }
}
