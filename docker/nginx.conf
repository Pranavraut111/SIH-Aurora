# ═══════════════════════════════════════════════════════════════
#  Aurora — nginx: serves the Vite bundle and reverse-proxies the backend so the
#  browser only ever talks to one origin (no CORS, no backend address in the JS).
#
#  Installed as /etc/nginx/templates/default.conf.template, so the nginx entrypoint
#  substitutes ${BACKEND_HOST} and ${BACKEND_PORT} at container start.
# ═══════════════════════════════════════════════════════════════

# ── Backend resolution ───────────────────────────────────────
# NOT an `upstream` block with a static server name: nginx resolves such a name ONCE at
# config load, so recreating the backend container (new IP) leaves nginx proxying to a
# dead address until nginx itself restarts. That is a realistic flow — editing .env and
# running `docker compose up -d` recreates the backend but leaves this container alone —
# and the whole site would 502.
#
# Using a variable in proxy_pass makes nginx resolve per request instead, via this
# resolver. NGINX_LOCAL_RESOLVERS is filled in from the container's /etc/resolv.conf by
# the image's entrypoint (NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1), so Docker's embedded DNS
# is picked up without being hardcoded.
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
resolver_timeout 5s;

# ── Rate limiting ────────────────────────────────────────────
# Two zones keyed on the client address. 10m holds ~160k addresses, far more than a demo
# needs. These protect the backend from a hammering; ADMIN_TOKEN protects writes, and the
# simulator's own GROQ_MAX_CALLS_PER_HOUR caps the spend regardless of these limits.
#
#   api     general traffic. The dashboard polls several endpoints every 2–4 s, and a page
#           load fans out to roughly a dozen requests, so 10 r/s with a burst of 20
#           leaves normal use untouched.
#   explain the AI explain routes, which cost an upstream LLM call: 5 per minute.
limit_req_zone $binary_remote_addr zone=aurora_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=aurora_explain:10m rate=5r/m;

# 429 rather than nginx's default 503, so the UI can tell "slow down" from "broken".
limit_req_status 429;
limit_conn_status 429;

# Cap concurrent connections per address as well: the WebSocket is long-lived, and a
# handful of browser tabs is normal, so this only stops a connection flood.
limit_conn_zone $binary_remote_addr zone=aurora_conn:10m;

# Map the client's Upgrade header through to the backend. Without this a plain
# `proxy_set_header Connection upgrade` would break ordinary keep-alive requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The browser sees the station config, telemetry snapshots and reports; none of it
    # is large, but gzip still saves a lot on the JSON and the bundle.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # No endpoint takes a large body: the biggest is a telemetry batch (bounded to
    # 20x20 sensors by the Pydantic model) and an explain request (free text capped at
    # 500 chars). 64 kB is generous, and anything larger gets 413 before it reaches
    # the backend.
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    server_tokens off;

    # 64 concurrent connections per address: plenty for several tabs plus WebSockets.
    limit_conn aurora_conn 64;

    # A readable 429 instead of nginx's HTML error page. The UI shows `detail`.
    error_page 429 = @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Retry-After 10 always;
        return 429 '{"detail":"Too many requests — please slow down and try again in a few seconds."}';
    }

    # 413 for an oversized body, in the same JSON shape the frontend already parses.
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        return 413 '{"detail":"Request body too large (limit 64 kB)."}';
    }

    # ── Security headers ──────────────────────────────────────
    # add_header is not additive across levels: a location that sets any header of its
    # own loses every header inherited from here. The snippet is therefore included in
    # each location below as well — removing it from one silently drops the CSP there.
    include /etc/nginx/snippets/security-headers.conf;

    # ── Container healthcheck ─────────────────────────────────
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── WebSocket: /ws/station -> backend ─────────────────────
    # Must come before the SPA fallback. The telemetry stream is long-lived and the
    # backend only pushes on each tick, so the read timeout has to be generous.
    location /ws {
        set $aurora_backend "${BACKEND_HOST}:${BACKEND_PORT}";
        proxy_pass http://$aurora_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ── AI explain: the expensive route, limited hard ─────────
    # Every call can mean an upstream LLM request, so this is 5/min per address with a
    # burst of 2 (no nodelay: a second request waits rather than being rejected).
    # The three paths are aliases of one backend route.
    location ~ ^/api/(aurora-explain|explain|ai/explain)$ {
        limit_req zone=aurora_explain burst=2;
        set $aurora_backend "${BACKEND_HOST}:${BACKEND_PORT}";
        proxy_pass http://$aurora_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An LLM round trip is slower than an ordinary API call.
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # ── REST: /api/* -> backend ───────────────────────────────
    location /api/ {
        # burst=20 with nodelay absorbs a page load's fan-out without queueing it.
        limit_req zone=aurora_api burst=20 nodelay;
        set $aurora_backend "${BACKEND_HOST}:${BACKEND_PORT}";
        proxy_pass http://$aurora_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The AI/explain routes are proxied on to the simulator, and a Chronos
        # forecast can take a few seconds on a small VM.
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
        # API responses are per-request state; never let a proxy or browser keep them.
        add_header Cache-Control "no-store" always;
    }

    # ── Static assets ─────────────────────────────────────────
    # Vite fingerprints every file under /assets/, so these can be cached forever.
    location /assets/ {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unhashed files in public/ (the favicon, logos): a day is a safe middle ground.
    location ~* \.(?:ico|png|jpe?g|gif|svg|webp|woff2?)$ {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # ── SPA fallback ──────────────────────────────────────────
    # index.html must never be cached, or a browser keeps loading asset hashes that
    # no longer exist after an update.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
    }
}
