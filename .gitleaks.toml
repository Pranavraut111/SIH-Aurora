# Aurora — gitleaks configuration (used by the `secrets` job in .github/workflows/ci.yml).
# Extends gitleaks' default rule set; only documentation placeholders are allowlisted.
[extend]
useDefault = true

[[rules]]
# Keep the default generic-api-key rule but let it ignore truncated placeholders.
id = "generic-api-key"
description = "Generic API key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=|\?=|,)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''
entropy = 3.5
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

[rules.allowlist]
regexTarget = "match"
regexes = [
  # Documentation placeholders that end in an ellipsis, e.g. `GROQ_API_KEY=gsk_...`
  # in README.md. A real credential never ends in "...".
  '''\.\.\.\s*$''',
]

[allowlist]
description = "Committed demo data, lockfiles and model artefacts contain no credentials"
paths = [
  '''package-lock\.json''',
  '''simulator/weather_cache/.*\.json''',
  '''simulator/data_store/.*''',
  '''simulator/.*\.pkl''',
  '''\.gitleaks\.toml''',
]
